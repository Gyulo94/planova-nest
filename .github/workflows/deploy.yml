name: CI/CD 파이프라인 (planova-nest)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20.19.0 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: npm 의존성 설치
        run: npm install

      - name: NestJS 빌드
        run: npm run build

      - name: 도커 이미지 빌드
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.SERVICE_NAME }} .

      - name: 도커 허브 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 도커 허브에 이미지 푸시
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.SERVICE_NAME }}

      - name: 원격서버에 배포
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT }}
          script: |
            TARGET_DIR="${{ secrets.REMOTE_PROJECT_PATH }}"

            if [ ! -d "$TARGET_DIR" ]; then
              mkdir -p "$TARGET_DIR"
            fi
            cd "$TARGET_DIR"

            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            echo "${{secrets.ENV_FILE}}" > ./.env
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.SERVICE_NAME }}:latest

            docker stop ${{ secrets.SERVICE_NAME }} || true
            docker rm ${{ secrets.SERVICE_NAME }} || true 

            docker run --rm \
            --network nginx-proxy_gyubuntu_net \
            --env-file ./.env \
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.SERVICE_NAME }}:latest \
            sh -c "npx prisma migrate deploy"

            docker run -d \
            -p 8005:8000 \
            --name ${{ secrets.SERVICE_NAME }} \
            --network nginx-proxy_gyubuntu_net \
            --env-file ./.env \
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.SERVICE_NAME }}:latest \
            sh -c "npm run start:prod" 
            docker image prune -f

      - name: 성공 메세지 출력
        if: success()
        run: echo "🎉 CI/CD 파이프라인 성공"
